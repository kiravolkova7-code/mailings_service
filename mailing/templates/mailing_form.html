<h1>{% if object %}Редактирование{% else %}Создание{% endif %} рассылки</h1>

<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <table>
        {{ form.as_table }}
    </table>
    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'mailings:list' %}">Отмена</a>
